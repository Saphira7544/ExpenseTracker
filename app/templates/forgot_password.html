<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Forgot password - Expense Tracker</title>
  <link rel="stylesheet" href="{{ static_url('style.css') }}">
  <link rel="icon" type="image/png" href="{{ static_url('favicon.png') }}">
</head>
<body style="display:flex; align-items:center; justify-content:center; min-height:100vh; background:#f5f6fa;">
  <div class="card" style="width:380px;">
    <h1 style="margin-bottom:8px;">Forgot password</h1>
    {% if message %}
      <p style="color:#16a34a; margin-bottom:12px;">{{ message }}</p>
      <p style="font-size:13px; color:#6b7280;">Don't see it? Check your spam folder, or ask again in a few minutes.</p>
    {% else %}
      <p style="font-size:14px; color:#6b7280; margin-bottom:16px;">
        Enter your account's email and we'll send you a link to choose a new password.
      </p>
      {% if error %}
        <p style="color:#dc2626; margin-bottom:12px;">{{ error }}</p>
      {% endif %}
      <form method="post" action="/forgot-password">
        <label>Email</label>
        <input type="email" name="email" required autofocus autocomplete="email" style="margin-bottom:16px;">
        <button class="primary" type="submit" style="width:100%;">Send reset link</button>
      </form>
    {% endif %}
    <p style="margin-top:12px; font-size:14px;"><a href="/login">Back to sign in</a></p>
  </div>
</body>
</html>
