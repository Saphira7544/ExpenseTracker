<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="{{ static_url('style.css') }}">
    <link rel="icon" type="image/png" href="{{ static_url('favicon.png') }}">
    <link rel="stylesheet" href="{{ static_url('modern-theme.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
        // Escape untrusted text before interpolating it into innerHTML templates.
        function esc(value) {
            return String(value ?? "").replace(/[&<>"']/g, c => (
                { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
            ));
        }

        // Fixed colour per category (app/core/categories.py), shared by badges and charts.
        const CATEGORY_COLORS = {{ category_colors | tojson }};

        function categoryColor(category) {
            return CATEGORY_COLORS[category || "Uncategorized"] || CATEGORY_COLORS["Other"];
        }

        // Dark text on light colours, white on dark ones (WCAG relative luminance).
        function readableTextOn(hex) {
            const lum = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255)
                .map(c => c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4)
                .reduce((sum, c, i) => sum + c * [0.2126, 0.7152, 0.0722][i], 0);
            return (1.05 / (lum + 0.05)) >= 4.5 ? "#ffffff" : "#1f2937";
        }

        function categoryBadge(category) {
            const label = category || "Uncategorized";
            const bg = categoryColor(category);
            return `<span class="badge" style="background:${bg}; color:${readableTextOn(bg)}">${esc(label)}</span>`;
        }
    </script>
</head>
<body>
    <nav class="sidebar">
        <h2><i class="fa-solid fa-wallet"></i> Expense Tracker</h2>
        <div class="sidebar-user">{{ user.email if user else "" }}</div>

        <a href="/" class="{{ 'active' if active_page == 'dashboard' }}">
            <i class="fa-solid fa-chart-simple"></i> Dashboard
        </a>
        <a href="/monthly" class="{{ 'active' if active_page == 'monthly' }}">
            <i class="fa-solid fa-calendar-days"></i> Monthly
        </a>
        <a href="/upload" class="{{ 'active' if active_page == 'upload' }}">
            <i class="fa-solid fa-file-arrow-up"></i> Upload Files
        </a>
        <a href="/transactions" class="{{ 'active' if active_page == 'transactions' }}">
            <i class="fa-solid fa-receipt"></i> Transactions
        </a>
        <a href="/rules" class="{{ 'active' if active_page == 'rules' }}">
            <i class="fa-solid fa-sliders"></i> Rules
        </a>

        <div class="sidebar-section-label">Net Worth</div>

        <a href="/networth" class="{{ 'active' if active_page == 'networth' }}">
            <i class="fa-solid fa-coins"></i> Net Worth
        </a>
        <a href="/networth/config" class="{{ 'active' if active_page == 'networth_config' }}">
            <i class="fa-solid fa-gear"></i> Net Worth Config
        </a>
        <a href="/networth/analytics" class="{{ 'active' if active_page == 'networth_charts' }}">
            <i class="fa-solid fa-chart-line"></i> Net Worth Analytics
        </a>

        <a href="/settings" class="{{ 'active' if active_page == 'settings' }}">
            <i class="fa-solid fa-user-gear"></i> Settings
        </a>
        <a href="/banks" class="{{ 'active' if active_page == 'banks' }}">
            <i class="fa-solid fa-building-columns"></i> Banks
        </a>

        <button type="button" class="update-ready" id="updateReady" hidden onclick="restartApp()"
                title="Code changed since the app started: restart to load it">
            <i class="fa-solid fa-rotate"></i> Update ready · Restart
        </button>

        <form method="post" action="/logout" style="padding: 16px 24px; margin-top: auto;">
            <button class="secondary" type="submit" style="width: 100%;">
                <i class="fa-solid fa-right-from-bracket"></i> Logout
            </button>
        </form>
    </nav>
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>
<div class="restart-overlay" id="restartOverlay" hidden>
    <div><i class="fa-solid fa-rotate fa-spin"></i><p id="restartMessage">Restarting Expense Tracker…</p></div>
</div>
<script>
    // Local desktop app (localapp/): restart to load code changes; offer it in the sidebar when ready.
    async function restartApp() {
        const res = await fetch("/api/system/restart", { method: "POST" });
        if (!res.ok) {
            alert("Couldn't restart: " + ((await res.json().catch(() => ({}))).detail || res.status));
            return;
        }
        document.getElementById("restartOverlay").hidden = false;
        await new Promise(r => setTimeout(r, 1500));          // let the old server go away
        for (let i = 0; i < 120; i++) {
            try {
                const ping = await fetch("/api/system/ping", { cache: "no-store" });
                if (ping.ok) { location.reload(); return; }
            } catch (e) { /* still restarting */ }
            await new Promise(r => setTimeout(r, 1000));
        }
        document.getElementById("restartMessage").textContent =
            "This is taking longer than expected. Check logs/server.log in the project folder.";
    }

    fetch("/api/system/status").then(r => r.ok ? r.json() : null).then(s => {
        if (s && s.managed && s.can_control && s.code_changed) document.getElementById("updateReady").hidden = false;
    }).catch(() => {});
</script>
</body>
</html>
