<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Choose a new password - Expense Tracker</title>
  <meta name="referrer" content="no-referrer">
  <link rel="stylesheet" href="{{ static_url('style.css') }}">
  <link rel="icon" type="image/png" href="{{ static_url('favicon.png') }}">
</head>
<body style="display:flex; align-items:center; justify-content:center; min-height:100vh; background:#f5f6fa;">
  <div class="card" style="width:380px;">
    {% if token %}
      <h1 style="margin-bottom:8px;">Choose a new password</h1>
      <p style="font-size:14px; color:#6b7280; margin-bottom:16px;">
        At least 8 characters. You'll be signed out everywhere else.
      </p>
      {% if error %}
        <p style="color:#dc2626; margin-bottom:12px;">{{ error }}</p>
      {% endif %}
      <form method="post" action="/reset-password">
        <input type="hidden" name="token" value="{{ token }}">
        <label>New password</label>
        <input type="password" name="password" required minlength="8" autofocus autocomplete="new-password" style="margin-bottom:12px;">
        <label>Repeat it</label>
        <input type="password" name="confirm" required minlength="8" autocomplete="new-password" style="margin-bottom:16px;">
        <button class="primary" type="submit" style="width:100%;">Save new password</button>
      </form>
    {% else %}
      <h1 style="margin-bottom:8px;">Link expired</h1>
      <p style="font-size:14px; color:#6b7280; margin-bottom:16px;">
        This reset link has already been used, has expired, or was replaced by a newer one.
      </p>
      <a href="/forgot-password"><button class="primary" type="button" style="width:100%;">Send a new link</button></a>
    {% endif %}
    <p style="margin-top:12px; font-size:14px;"><a href="/login">Back to sign in</a></p>
  </div>
</body>
</html>
