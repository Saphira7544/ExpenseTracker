{% extends "base.html" %}
{% block content %}

<h1>Monthly</h1>

<div class="card">
    <div class="filter-bar">
        <label for="year-select">Year</label>
        <select id="year-select"></select>
        <div class="month-buttons" id="month-buttons" role="radiogroup" aria-label="Month"></div>
        <label for="currency-select">Currency</label>
        <select id="currency-select"></select>
    </div>
    <div class="fx-notice" id="fx-notice"></div>
</div>

<div class="summary-row" id="summary-cards"></div>

<div class="charts-grid">
    <div class="card chart-card">
        <h2><i class="fa-solid fa-chart-pie"></i> Expenses by Category</h2>
        <canvas id="categoryPieChart"></canvas>
    </div>

    <div class="card">
        <h2><i class="fa-solid fa-list"></i> Category Breakdown</h2>
        <table id="category-table">
            <thead>
                <tr>
                    <th></th>
                    <th>Category</th>
                    <th style="text-align:right;">Amount</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <div class="card chart-card" style="grid-column: 1 / -1;">
        <h2><i class="fa-solid fa-calendar-week"></i> Daily Spend</h2>
        <canvas id="dailySpendChart"></canvas>
    </div>
</div>

<div class="card">
    <h2><i class="fa-solid fa-ranking-star"></i> Top Expenses</h2>
    <table id="top-merchants-table">
        <thead>
            <tr>
                <th>Description</th>
                <th>Occurrences</th>
                <th style="text-align:right;">Total</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<link rel="stylesheet" href="{{ static_url('monthly.css') }}">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="{{ static_url('charts-common.js') }}"></script>
<script src="{{ static_url('monthly.js') }}"></script>
{% endblock %}
