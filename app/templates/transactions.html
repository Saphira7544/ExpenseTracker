{% extends "base.html" %}
{% block content %}
<link rel="stylesheet" href="{{ static_url('dialogs.css') }}">
<link rel="stylesheet" href="{{ static_url('transactions.css') }}">

<div class="page-header">
  <h1>Transactions</h1>
  <button class="primary" id="addTxBtn"><i class="fa-solid fa-plus"></i>Add transaction</button>
</div>

<div class="card">
  <div class="filters-grid">
    <div>
      <label>Search</label>
      <input type="text" id="searchInput" placeholder="Description...">
    </div>
    <div>
      <label>Account</label>
      <select id="accountFilter"><option value="">All</option></select>
    </div>
    <div>
      <label>Category</label>
      <select id="categoryFilter"><option value="">All</option></select>
    </div>
    <div>
      <label>Split status</label>
      <select id="splitFilter">
        <option value="">All</option>
        <option value="split">Split</option>
        <option value="not_split">Not split</option>
      </select>
    </div>
    <div>
      <label>Amount sign</label>
      <select id="signFilter">
        <option value="">All</option>
        <option value="positive">Positive</option>
        <option value="negative">Negative</option>
      </select>
    </div>
    <div>
      <label>Min amount</label>
      <input type="number" id="minAmount" step="0.01" placeholder="0.00">
    </div>
    <div>
      <label>Max amount</label>
      <input type="number" id="maxAmount" step="0.01" placeholder="0.00">
    </div>
    <div>
      <label>From</label>
      <input type="date" id="dateFrom">
    </div>
    <div>
      <label>To</label>
      <input type="date" id="dateTo">
    </div>
    <div>
  <button class="primary" id="filterBtn">Apply filters</button>
  </div>
  <div>
    <button class="secondary" id="resetFilterBtn">Reset filters</button>
  </div>
  </div>
</div>

<div class="card" id="bulkActionBar" style="display:none; margin-bottom:12px; padding:12px 16px;">
  <span id="selectedCount" style="font-size:13px; color:#374151; margin-right:12px;"></span>
  <select id="bulkCategorySelect" style="width:auto; display:inline-block;"></select>
  <button class="primary" id="bulkApplyBtn" style="margin-left:8px;">Apply to selected</button>
  <button class="secondary" id="bulkClearBtn" style="margin-left:8px;">Clear selection</button>
  <button class="danger" id="bulkDeleteBtn" style="margin-left:8px;"><i class="fa-solid fa-trash"></i> Delete selected</button>
</div>

<div class="card">
  <div class="table-scroll">
  <table class="tx-table">
    <thead>
      <tr>
        <th class="col-select"><input type="checkbox" id="selectAllCheckbox" aria-label="Select all on this page"></th>
        <th class="col-edit"><span class="sr-only">Edit</span></th>
        <th>Date</th>
        <th>Description</th>
        <th>Account</th>
        <th>Category</th>
        <th class="col-amount">Amount</th>
        <th class="col-actions" style="text-align:right;">Actions</th>
      </tr>
    </thead>
    <tbody id="txBody"></tbody>
  </table>
  </div>
  <div style="display:flex; justify-content:space-between; align-items:center; margin-top:16px; flex-wrap:wrap; gap:12px;">
    <span id="pageInfo" style="font-size:13px; color:#6b7280;"></span>
    <div style="display:flex; gap:8px; align-items:center;">
      <label style="font-size:13px; color:#6b7280;">Per page:</label>
      <select id="pageSizeSelect" style="width:auto;">
        <option value="25">25</option>
        <option value="50" selected>50</option>
        <option value="100">100</option>
        <option value="200">200</option>
      </select>
      <button class="secondary" id="firstPageBtn">First</button>
      <button class="secondary" id="prevPageBtn">Previous</button>
      <button class="secondary" id="nextPageBtn">Next</button>
      <button class="secondary" id="lastPageBtn">Last</button>
    </div>
  </div>
</div>

<!-- Add / edit transaction dialog -->
<div class="modal-overlay" id="txModal">
  <div class="modal-box dialog-box" role="dialog" aria-modal="true" aria-labelledby="txModalTitle">
    <div class="dialog-header">
      <h1 id="txModalTitle">Add transaction</h1>
      <button type="button" class="icon-btn small" id="txCloseBtn" title="Close"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <p class="dialog-note" id="txModalNote"></p>

    <form id="txForm" novalidate>
      <div class="segmented" role="radiogroup" aria-label="Direction">
        <label><input type="radio" name="txDirection" value="out" checked><span class="out">Money out</span></label>
        <label><input type="radio" name="txDirection" value="in"><span class="in">Money in</span></label>
      </div>

      <div class="form-grid">
        <label>Date
          <input type="date" id="txDate" required>
        </label>
        <label>Amount
          <input type="number" id="txAmount" step="0.01" min="0.01" placeholder="0.00" required>
        </label>
        <label>Currency
          <select id="txCurrency"></select>
        </label>
        <label class="span-all">Description
          <input type="text" id="txDescription" placeholder="e.g. Dinner at Zeughauskeller" required>
        </label>
        <label>Account
          <input type="text" id="txAccount" list="accountOptions" placeholder="e.g. Cash" required>
        </label>
        <label class="span-2">Category
          <select id="txCategory"></select>
        </label>
      </div>
      <datalist id="accountOptions"></datalist>

      <p class="form-error" id="txError" role="alert"></p>

      <div class="dialog-footer">
        <button type="button" class="danger" id="txDeleteBtn"><i class="fa-solid fa-trash"></i> Delete</button>
        <div class="spacer"></div>
        <button type="button" class="secondary" id="txCancelBtn">Cancel</button>
        <button type="submit" class="primary" id="txSaveBtn">Save</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-overlay" id="splitModal">
  <div class="modal-box">
    <h1>Split Transaction</h1>
    <p>Total: <span id="splitTotal"></span> — <span id="splitAllocated">0</span> allocated</p>
    <div id="splitRows"></div>
    <button class="secondary" id="addSplitRow">+ Add row</button>
    <p style="font-size:12px; color:#6b7280; margin-top:8px;">Leftover amount will be auto-filed as:</p>
    <select id="remainderCategory">
    </select>
    <div style="margin-top:16px; display:flex; gap:8px;">
      <button class="primary" id="saveSplitBtn">Save split</button>
      <button class="secondary" id="cancelSplitBtn">Cancel</button>
    </div>
    <p id="splitError" style="color:#dc2626; margin-top:8px;"></p>
  </div>
</div>

<script>

let CATEGORIES = [];

async function loadCategories() {
    const res = await fetch('/api/categories');
    CATEGORIES = await res.json();
}
let currentSplitId = null;
let currentSplitAmount = 0;
let pageSize = 50;
let currentOffset = 0;
let lastRowCount = 0;
let totalCount = 0;
let selectedIds = new Set();
let rowsById = new Map();     // transactions on the current page, for the dialogs
let filterData = { accounts: [], categories: [], currencies: [] };

function catClass(cat) {
  return "cat-" + (cat || "Other").replace(/[\/\s]/g, "-");
}

function options(values, selected) {
  return values.map(v => `<option value="${esc(v)}" ${v === selected ? "selected" : ""}>${esc(v)}</option>`).join("");
}

function formatDate(iso) {
  const [y, m, d] = String(iso).split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(undefined, { day: "2-digit", month: "short", year: "numeric" });
}

function formatAmount(amount) {
  return new Intl.NumberFormat(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(amount);
}

function initCategorySelects() {
  document.getElementById("remainderCategory").innerHTML = options(CATEGORIES, "Other");
  document.getElementById("bulkCategorySelect").innerHTML = options(CATEGORIES);
  document.getElementById("txCategory").innerHTML =
    `<option value="">Uncategorized (let rules decide)</option>` + options(CATEGORIES);
}

// Rebuilt after adding/editing, since a new account or category may appear.
async function loadFilters() {
  const res = await fetch("/api/transactions/filters");
  filterData = await res.json();

  const accSel = document.getElementById("accountFilter");
  const catSel = document.getElementById("categoryFilter");
  const [acc, cat] = [accSel.value, catSel.value];
  accSel.innerHTML = `<option value="">All</option>` + options(filterData.accounts, acc);
  catSel.innerHTML = `<option value="">All</option>` + options(filterData.categories, cat);

  document.getElementById("accountOptions").innerHTML =
    filterData.accounts.map(a => `<option value="${esc(a)}"></option>`).join("");
}

function rowHtml(tx) {
  const id = esc(tx.transactionid);
  const isSplit = tx.category === "Split";
  const isManualEntry = tx.sourcefile === "manual";
  const amountClass = tx.amount >= 0 ? "amount-positive" : "amount-negative";

  const categoryControl = isSplit
    ? `<select disabled title="Undo the split to change its category"><option>Split</option></select>`
    : `<select class="cat-select" data-id="${id}" aria-label="Category">
         <option value="" ${tx.category ? "" : "selected"} disabled>Set category…</option>
         ${options(CATEGORIES, tx.category)}
       </select>`;

  const splitAction = isSplit
    ? `<button class="icon-btn small danger undo-split-btn" data-id="${id}" title="Undo split"><i class="fa-solid fa-arrow-rotate-left"></i></button>`
    : `<button class="icon-btn small split-btn" data-id="${id}" title="Split across categories"><i class="fa-solid fa-scissors"></i></button>`;

  const revertAction = tx.is_manual_category && !isSplit
    ? `<button class="icon-btn small revert-btn" data-id="${id}" title="Let rules decide the category again"><i class="fa-solid fa-wand-magic-sparkles"></i></button>`
    : `<span class="icon-slot"></span>`;

  return `
    <td class="col-select"><input type="checkbox" class="row-checkbox" data-id="${id}" aria-label="Select"></td>
    <td class="col-edit">
      <button class="icon-btn small edit-btn" data-id="${id}" title="Edit transaction"><i class="fa-solid fa-pen"></i></button>
    </td>
    <td class="col-date">${esc(formatDate(tx.date))}</td>
    <td>
      <div class="tx-desc" title="${esc(tx.description)}">${esc(tx.description)}${isManualEntry ? '<span class="tx-pill">Manual</span>' : ''}</div>
    </td>
    <td>${esc(tx.account)}</td>
    <td>
      <span class="badge ${esc(catClass(tx.category))}">${esc(tx.category || "Uncategorized")}</span>
      ${tx.is_manual_category && !isSplit ? '<span class="manual-tag" title="Category set by hand; rules leave it alone">manual</span>' : ''}
    </td>
    <td class="col-amount ${amountClass}">${esc(formatAmount(tx.amount))}<span class="tx-currency">${esc(tx.currency)}</span></td>
    <td class="col-actions"><div class="tx-actions">${categoryControl}${splitAction}${revertAction}</div></td>
  `;
}

async function loadTransactions() {
  const params = new URLSearchParams();
  const search = document.getElementById("searchInput").value;
  const account = document.getElementById("accountFilter").value;
  const category = document.getElementById("categoryFilter").value;
  const splitStatus = document.getElementById("splitFilter").value;
  const amountSign = document.getElementById("signFilter").value;
  const minAmount = document.getElementById("minAmount").value;
  const maxAmount = document.getElementById("maxAmount").value;
  const dateFrom = document.getElementById("dateFrom").value;
  const dateTo = document.getElementById("dateTo").value;

  if (search) params.append("search", search);
  if (account) params.append("account", account);
  if (category) params.append("category", category);
  if (splitStatus) params.append("split_status", splitStatus);
  if (amountSign) params.append("amount_sign", amountSign);
  if (minAmount) params.append("min_amount", minAmount);
  if (maxAmount) params.append("max_amount", maxAmount);
  if (dateFrom) params.append("date_from", dateFrom);
  if (dateTo) params.append("date_to", dateTo);

  params.append("limit", pageSize);
  params.append("offset", currentOffset);
  const res = await fetch("/api/transactions?" + params.toString());
  const rows = await res.json();

  lastRowCount = rows.length;

  const countParams = new URLSearchParams(params);
  countParams.delete("limit");
  countParams.delete("offset");
  const countRes = await fetch("/api/transactions/count?" + countParams.toString());
  const countData = await countRes.json();
  totalCount = countData.total;

  updatePaginationUI();

  const tbody = document.getElementById("txBody");
  tbody.innerHTML = "";
  rowsById = new Map(rows.map(tx => [tx.transactionid, tx]));

  rows.forEach(tx => {
    const tr = document.createElement("tr");
    tr.innerHTML = rowHtml(tx);
    tbody.appendChild(tr);
  });
  if (!rows.length) {
    tbody.innerHTML = `<tr><td colspan="8" class="empty-state">No transactions match these filters.</td></tr>`;
  }

  document.querySelectorAll(".cat-select").forEach(sel => {
    sel.onchange = async () => {
      await fetch(`/api/transactions/${encodeURIComponent(sel.dataset.id)}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json"},
        body: JSON.stringify({ category: sel.value }),
      });
      loadTransactions();
    };
  });

  selectedIds.clear();
  updateBulkBar();
  document.getElementById("selectAllCheckbox").checked = false;

  document.querySelectorAll(".row-checkbox").forEach(cb => {
    cb.onchange = () => {
      if (cb.checked) {
        selectedIds.add(cb.dataset.id);
      } else {
        selectedIds.delete(cb.dataset.id);
      }
      updateBulkBar();
    };
  });
}

// Row buttons (delegated, so they work after every re-render)
document.getElementById("txBody").addEventListener("click", async (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  const id = btn.dataset.id;

  if (btn.classList.contains("edit-btn")) {
    openTxDialog(rowsById.get(id));
  } else if (btn.classList.contains("split-btn")) {
    openSplitDialog(rowsById.get(id));
  } else if (btn.classList.contains("undo-split-btn")) {
    await fetch(`/api/transactions/${encodeURIComponent(id)}/split`, { method: "DELETE" });
    loadTransactions();
  } else if (btn.classList.contains("revert-btn")) {
    await fetch(`/api/transactions/${encodeURIComponent(id)}/revert-auto`, { method: "POST" });
    loadTransactions();
  }
});

// ---------- Add / edit dialog ----------

let editingTx = null;   // null = adding a new transaction

function setDirection(dir) {
  document.querySelector(`input[name="txDirection"][value="${dir}"]`).checked = true;
}

function openTxDialog(tx = null) {
  editingTx = tx;
  const isSplit = tx && tx.category === "Split";
  const form = document.getElementById("txForm");
  form.reset();
  form.querySelectorAll(".invalid").forEach(el => el.classList.remove("invalid"));
  document.getElementById("txError").textContent = "";

  const currencies = filterData.currencies.length ? filterData.currencies : ["CHF", "EUR"];
  document.getElementById("txCurrency").innerHTML = options(currencies, tx ? tx.currency : currencies.includes("CHF") ? "CHF" : currencies[0]);

  document.getElementById("txModalTitle").textContent = tx ? "Edit transaction" : "Add transaction";
  document.getElementById("txDeleteBtn").style.display = tx ? "" : "none";

  if (tx) {
    setDirection(tx.amount >= 0 ? "in" : "out");
    document.getElementById("txDate").value = tx.date;
    document.getElementById("txAmount").value = Math.abs(tx.amount).toFixed(2);
    document.getElementById("txDescription").value = tx.description || "";
    document.getElementById("txAccount").value = tx.account || "";
    document.getElementById("txCategory").value = isSplit ? "" : (tx.category || "");
  } else {
    setDirection("out");
    const now = new Date();  // local date (toISOString would give the UTC date)
    document.getElementById("txDate").value =
      `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
  }

  // A split's parts must keep adding up, so amount/direction/category are locked.
  form.querySelectorAll('input[name="txDirection"]').forEach(r => r.disabled = isSplit);
  document.getElementById("txAmount").disabled = isSplit;
  document.getElementById("txCategory").disabled = isSplit;

  let note = "";
  if (isSplit) note = "This transaction is split. Undo the split to change its amount or category.";
  else if (tx && tx.sourcefile === "manual") note = "Added manually.";
  else if (tx) note = `Imported from ${tx.sourcefile}. Your edits are kept if you upload that file again.`;
  document.getElementById("txModalNote").textContent = note;

  document.getElementById("txModal").style.display = "flex";
  document.getElementById(tx ? "txDescription" : "txAmount").focus();
}

function closeTxDialog() {
  document.getElementById("txModal").style.display = "none";
  editingTx = null;
}

function readTxForm() {
  const fields = {
    date: document.getElementById("txDate"),
    amount: document.getElementById("txAmount"),
    description: document.getElementById("txDescription"),
    account: document.getElementById("txAccount"),
  };
  Object.values(fields).forEach(el => el.classList.remove("invalid"));

  const missing = [];
  if (!fields.date.value) missing.push(fields.date);
  if (!(parseFloat(fields.amount.value) > 0)) missing.push(fields.amount);
  if (!fields.description.value.trim()) missing.push(fields.description);
  if (!fields.account.value.trim()) missing.push(fields.account);
  if (missing.length) {
    missing.forEach(el => el.classList.add("invalid"));
    missing[0].focus();
    return { error: "Please fill in the highlighted fields (amount must be greater than 0)." };
  }

  const direction = document.querySelector('input[name="txDirection"]:checked').value;
  const magnitude = Math.round(parseFloat(fields.amount.value) * 100) / 100;
  return {
    payload: {
      date: fields.date.value,
      amount: direction === "out" ? -magnitude : magnitude,
      currency: document.getElementById("txCurrency").value,
      description: fields.description.value.trim(),
      account: fields.account.value.trim(),
      category: document.getElementById("txCategory").value || null,
    },
  };
}

function apiErrorMessage(body, status) {
  if (Array.isArray(body.detail)) {
    return body.detail.map(d => `${d.loc[d.loc.length - 1]}: ${d.msg}`).join("; ");
  }
  return body.detail || `Request failed (${status})`;
}

document.getElementById("txForm").onsubmit = async (e) => {
  e.preventDefault();
  const { payload, error } = readTxForm();
  const errorEl = document.getElementById("txError");
  if (error) { errorEl.textContent = error; return; }

  // A split's category isn't editable here; send what it has so validation passes.
  if (editingTx && editingTx.category === "Split") payload.category = null;

  const saveBtn = document.getElementById("txSaveBtn");
  saveBtn.disabled = true;
  try {
    const res = editingTx
      ? await fetch(`/api/transactions/${encodeURIComponent(editingTx.transactionid)}`, {
          method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload),
        })
      : await fetch("/api/transactions", {
          method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload),
        });
    if (!res.ok) {
      errorEl.textContent = apiErrorMessage(await res.json().catch(() => ({})), res.status);
      return;
    }
    closeTxDialog();
    await loadFilters();
    loadTransactions();
  } finally {
    saveBtn.disabled = false;
  }
};

document.getElementById("txDeleteBtn").onclick = async () => {
  if (!editingTx) return;
  const comesBack = editingTx.sourcefile !== "manual"
    ? `\n\nIt will be imported again if you upload ${editingTx.sourcefile} again.` : "";
  if (!confirm(`Delete "${editingTx.description}"? This can't be undone.${comesBack}`)) return;

  const res = await fetch(`/api/transactions/${encodeURIComponent(editingTx.transactionid)}`, { method: "DELETE" });
  if (!res.ok) {
    document.getElementById("txError").textContent = apiErrorMessage(await res.json().catch(() => ({})), res.status);
    return;
  }
  closeTxDialog();
  await loadFilters();
  loadTransactions();
};

document.getElementById("addTxBtn").onclick = () => openTxDialog();
document.getElementById("txCancelBtn").onclick = closeTxDialog;
document.getElementById("txCloseBtn").onclick = closeTxDialog;
document.getElementById("txModal").addEventListener("mousedown", (e) => {
  if (e.target.id === "txModal") closeTxDialog();   // click on the backdrop
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && document.getElementById("txModal").style.display === "flex") closeTxDialog();
});

// ---------- Split dialog ----------

function addSplitRow() {
  const row = document.createElement("div");
  row.className = "split-row";
  row.innerHTML = `
    <select class="split-category">${options(CATEGORIES)}</select>
    <input type="number" class="split-amount" placeholder="Amount" step="0.01">
  `;
  document.getElementById("splitRows").appendChild(row);
  row.querySelector(".split-amount").addEventListener("input", updateAllocatedDisplay);
}

function updateAllocatedDisplay() {
  const amounts = Array.from(document.querySelectorAll(".split-amount")).map(i => parseFloat(i.value) || 0);
  const sum = amounts.reduce((a, b) => a + b, 0);
  document.getElementById("splitAllocated").textContent = sum.toFixed(2);
}

function openSplitDialog(tx) {
  currentSplitId = tx.transactionid;
  currentSplitAmount = Math.abs(parseFloat(tx.amount));
  document.getElementById("splitTotal").textContent = currentSplitAmount.toFixed(2);
  document.getElementById("splitAllocated").textContent = "0.00";
  document.getElementById("splitRows").innerHTML = "";
  document.getElementById("splitError").textContent = "";
  addSplitRow();
  document.getElementById("splitModal").style.display = "flex";
}

document.getElementById("addSplitRow").onclick = addSplitRow;
document.getElementById("cancelSplitBtn").onclick = () => {
  document.getElementById("splitModal").style.display = "none";
};

document.getElementById("saveSplitBtn").onclick = async () => {
  const rows = document.querySelectorAll("#splitRows > div");
  const splits = Array.from(rows).map(r => ({
    category: r.querySelector(".split-category").value,
    amount: parseFloat(r.querySelector(".split-amount").value || 0),
  })).filter(s => s.amount > 0);

  const sum = splits.reduce((a, s) => a + s.amount, 0);
  if (sum > currentSplitAmount + 0.01) {
    document.getElementById("splitError").textContent = `Allocated ${sum.toFixed(2)} exceeds total ${currentSplitAmount.toFixed(2)}`;
    return;
  }

  const remainderCategory = document.getElementById("remainderCategory").value;

  const res = await fetch(`/api/transactions/${encodeURIComponent(currentSplitId)}/split`, {
    method: "POST",
    headers: { "Content-Type": "application/json"},
    body: JSON.stringify({ splits, remainder_category: remainderCategory }),
  });

  if (res.ok) {
    document.getElementById("splitModal").style.display = "none";
    loadTransactions();
  } else {
    const err = await res.json();
    document.getElementById("splitError").textContent = apiErrorMessage(err, res.status);
  }
};

// ---------- Bulk actions ----------

function updateBulkBar() {
  const bar = document.getElementById("bulkActionBar");
  const count = selectedIds.size;
  if (count > 0) {
    bar.style.display = "block";
    document.getElementById("selectedCount").textContent = `${count} selected`;
  } else {
    bar.style.display = "none";
  }
}

document.getElementById("selectAllCheckbox").onchange = (e) => {
  document.querySelectorAll(".row-checkbox").forEach(cb => {
    cb.checked = e.target.checked;
    if (e.target.checked) {
      selectedIds.add(cb.dataset.id);
    } else {
      selectedIds.delete(cb.dataset.id);
    }
  });
  updateBulkBar();
};

document.getElementById("bulkClearBtn").onclick = () => {
  selectedIds.clear();
  document.querySelectorAll(".row-checkbox").forEach(cb => cb.checked = false);
  document.getElementById("selectAllCheckbox").checked = false;
  updateBulkBar();
};

document.getElementById("bulkDeleteBtn").onclick = async () => {
  const count = selectedIds.size;
  if (count === 0) return;
  const imported = Array.from(selectedIds).filter(id => (rowsById.get(id) || {}).sourcefile !== "manual").length;
  const note = imported
    ? `

${imported} of them came from bank files and will come back if you upload those files again.`
    : "";
  if (!confirm(`Delete ${count} transaction${count === 1 ? "" : "s"}? This can't be undone.${note}`)) return;

  const res = await fetch("/api/transactions/bulk-delete", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ transaction_ids: Array.from(selectedIds) }),
  });
  if (!res.ok) {
    alert("Delete failed: " + apiErrorMessage(await res.json().catch(() => ({})), res.status));
    return;
  }
  selectedIds.clear();
  // Stay on a page that still exists after removing rows.
  if (currentOffset >= totalCount - count && currentOffset > 0) {
    currentOffset = Math.max(0, currentOffset - pageSize);
  }
  await loadFilters();
  loadTransactions();
};

document.getElementById("bulkApplyBtn").onclick = async () => {
  const category = document.getElementById("bulkCategorySelect").value;
  if (selectedIds.size === 0 || !category) return;

  const res = await fetch("/api/transactions/bulk-category", {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ transaction_ids: Array.from(selectedIds), category }),
  });

  if (res.ok) {
    selectedIds.clear();
    loadTransactions();
  } else {
    const err = await res.json();
    alert("Bulk update failed: " + apiErrorMessage(err, res.status));
  }
};

// ---------- Filters & pagination ----------

document.getElementById("filterBtn").onclick = () => {
  currentOffset = 0;
  loadTransactions();
};

document.getElementById("resetFilterBtn").onclick = () => {
  document.getElementById("searchInput").value = "";
  document.getElementById("accountFilter").value = "";
  document.getElementById("categoryFilter").value = "";
  document.getElementById("splitFilter").value = "";
  document.getElementById("signFilter").value = "";
  document.getElementById("minAmount").value = "";
  document.getElementById("maxAmount").value = "";
  document.getElementById("dateFrom").value = "";
  document.getElementById("dateTo").value = "";
  currentOffset = 0;
  loadTransactions();
};

loadCategories().then(async () => {
    initCategorySelects();
    await loadFilters();
    loadTransactions();
});

function updatePaginationUI() {
  const start = currentOffset + 1;
  const end = currentOffset + lastRowCount;
  document.getElementById("pageInfo").textContent = lastRowCount === 0
    ? "No results"
    : `Showing ${start}–${end} of ${totalCount}`;

  document.getElementById("firstPageBtn").disabled = currentOffset === 0;
  document.getElementById("prevPageBtn").disabled = currentOffset === 0;
  document.getElementById("nextPageBtn").disabled = end >= totalCount;
  document.getElementById("lastPageBtn").disabled = end >= totalCount;
}

document.getElementById("firstPageBtn").onclick = () => {
  currentOffset = 0;
  loadTransactions();
};

document.getElementById("prevPageBtn").onclick = () => {
  currentOffset = Math.max(0, currentOffset - pageSize);
  loadTransactions();
};

document.getElementById("nextPageBtn").onclick = () => {
  if (currentOffset + pageSize < totalCount) {
    currentOffset += pageSize;
    loadTransactions();
  }
};

document.getElementById("lastPageBtn").onclick = () => {
  const lastPageStart = Math.floor((totalCount - 1) / pageSize) * pageSize;
  currentOffset = Math.max(0, lastPageStart);
  loadTransactions();
};

document.getElementById("pageSizeSelect").onchange = (e) => {
  pageSize = parseInt(e.target.value);
  currentOffset = 0;
  loadTransactions();
};
</script>
{% endblock %}
