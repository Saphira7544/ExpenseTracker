<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Register - Expense Tracker</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body style="display:flex; align-items:center; justify-content:center; min-height:100vh; background:#f5f6fa;">
  <div class="card" style="width:360px;">
    <h1 style="margin-bottom:16px;">Register</h1>
    {% if error %}
      <p style="color:#dc2626; margin-bottom:12px;">{{ error }}</p>
    {% endif %}
    <form method="post" action="/register">
      <label>Email</label>
      <input type="email" name="email" required style="margin-bottom:12px;">
      <label>Password</label>
      <input type="password" name="password" required style="margin-bottom:16px;">
      <button class="primary" type="submit" style="width:100%;">Create account</button>
    </form>
    <p style="margin-top:12px; font-size:14px;">
      Already have an account? <a href="/login">Login</a>
    </p>
  </div>
</body>
</html>
