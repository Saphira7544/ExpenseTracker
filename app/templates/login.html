<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Login - Expense Tracker</title>
  <link rel="stylesheet" href="{{ static_url('style.css') }}">
  <link rel="icon" type="image/png" href="{{ static_url('favicon.png') }}">
</head>
<body style="display:flex; align-items:center; justify-content:center; min-height:100vh; background:#f5f6fa;">
  <div class="card" style="width:360px;">
    <h1 style="margin-bottom:16px;">Login</h1>
    {% if error %}
      <p style="color:#dc2626; margin-bottom:12px;">{{ error }}</p>
    {% endif %}
    {% if message %}
      <p style="color:#16a34a; margin-bottom:12px;">{{ message }}</p>
    {% endif %}
    <form method="post" action="/login">
      <label>Email</label>
      <input type="email" name="email" required style="margin-bottom:12px;">
      <div style="display:flex; justify-content:space-between; align-items:baseline;">
        <label>Password</label>
        <a href="/forgot-password" style="font-size:13px;">Forgot password?</a>
      </div>
      <input type="password" name="password" required style="margin-bottom:16px;" autocomplete="current-password">
      <button class="primary" type="submit" style="width:100%;">Login</button>
    </form>
    <p style="margin-top:12px; font-size:14px;">
      No account? <a href="/register">Register</a>
    </p>
  </div>
</body>
</html>
